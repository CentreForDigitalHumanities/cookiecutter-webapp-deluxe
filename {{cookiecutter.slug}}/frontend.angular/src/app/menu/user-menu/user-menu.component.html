<ul class="navbar-nav">
    @if (authLoading$ | async) {
    <li class="navbar-text">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading user data...</span>
        </div>
    </li>
    } @if (user$ | async; as user) {
    <li class="nav-item" ngbDropdown>
        <button class="nav-link" ngbDropdownToggle id="userDropdown">
            <span class="icon">
                <fa-icon [icon]="faUser" />
            </span>
            &nbsp;
            {{ user.username }}
        </button>
        <div
            ngbDropdownMenu
            aria-labelledby="userDropdown"
            class="dropdown-menu dropdown-menu-end"
        >
            <a ngbDropdownItem [routerLink]="['/user-settings']">Settings</a>
            @if (user.isStaff) {
            <a ngbDropdownItem href="/admin/">Administration</a>
            }
            <button ngbDropdownItem (click)="logout()">Sign out</button>
        </div>
    </li>
    } @if (showSignIn$ | async) {
    <li class="nav-item">
        <a
            #linkActive="routerLinkActive"
            [routerLink]="['/login']"
            routerLinkActive="active"
            [queryParams]="
                linkActive.isActive ? null : { next: currentPath$ | async }
            "
            class="nav-link"
        >
            Sign in
        </a>
    </li>
    <li class="nav-item">
        <a
            [routerLink]="['/register']"
            routerLinkActive="active"
            class="nav-link"
        >
            Register
        </a>
    </li>
    } @if (logoutLoading$ | async) {
    <li class="d-flex align-items-center">
        <div class="spinner-border spinner-border-sm text-light" role="status">
            <span class="visually-hidden">Signing out...</span>
        </div>
    </li>
    }
</ul>
