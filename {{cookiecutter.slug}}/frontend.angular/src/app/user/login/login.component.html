<h1>Sign in</h1>

<p>Sign in using the form below.</p>

<form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
        <label for="username" class="form-label"> Username </label>
        <input
            type="text"
            id="username"
            class="form-control"
            [class.is-invalid]="
                form.controls.username.touched && form.controls.username.invalid
            "
            [formControl]="form.controls.username"
        />
        @for (error of usernameErrors$ | async; track $index) {
        <p class="invalid-feedback">
            {{ error }}
        </p>
        }
    </div>
    <div class="mb-3">
        <label for="password" class="form-label"> Password </label>
        <input
            type="password"
            id="password"
            class="form-control"
            [formControl]="form.controls.password"
            [class.is-invalid]="
                form.controls.password.touched && form.controls.password.invalid
            "
        />
        @for (error of passwordErrors$ | async; track $index) {
        <p class="invalid-feedback">
            {{ error }}
        </p>
        }
    </div>
    @for (error of formErrors$ | async; track $index) {
    <p class="invalid-feedback always-block">
        {{ error }}
    </p>
    }
    <div class="mb-3">
        <button type="submit" class="btn btn-primary mt-3">
            <span>Sign in</span>
            @if (loading$ | async) {
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">Logging in...</span>
            </div>
            }
        </button>
    </div>
</form>

<div>
    <a [routerLink]="['/password-forgotten']"> Forgotten your password? </a>
</div>
