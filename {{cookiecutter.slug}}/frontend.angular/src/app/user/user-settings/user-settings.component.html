<h1>User settings</h1>

<p>Use the form below to change your name or password.</p>

<form [formGroup]="form" (ngSubmit)="submit()">
    @if (form.controls.username; as control) {
    <div>
        <label for="username" class="form-label"> Username </label>
        <input
            type="text"
            id="username"
            class="form-control"
            [class.is-invalid]="control.touched && control.invalid"
            [formControl]="control"
        />
        @for (error of usernameErrors$ | async; track $index) {
        <p class="invalid-feedback">
            {{ error }}
        </p>
        }
    </div>
    <div>
        <label for="first-name" class="form-label">First name</label>
        <input
            type="text"
            id="first-name"
            class="form-control"
            [class.is-invalid]="
                form.controls.firstName.touched &&
                form.controls.firstName.invalid
            "
            [formControl]="form.controls.firstName"
        />
    </div>
    <div>
        <label for="last-name" class="form-label"> Last name </label>
        <input
            type="text"
            id="first-name"
            class="form-control"
            [class.is-invalid]="
                form.controls.lastName.touched && form.controls.lastName.invalid
            "
            [formControl]="form.controls.lastName"
        />
    </div>
    @for (error of formErrors$ | async; track $index) {
    <p class="invalid-feedback always-block">
        {{ error }}
    </p>
    }
    <div
        class="d-flex flex-wrap justify-content-start align-items-center button-row mt-3"
    >
        <button type="submit" class="btn btn-primary">
            <span>Save changes</span>
            @if (updateSettingsLoading$ | async) {
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden"
                    >Requesting password reset link...</span
                >
            </div>

            }
        </button>
        <button
            class="btn btn-primary"
            type="button"
            (click)="requestPasswordReset()"
        >
            <span>Request new password</span>
            @if (requestResetLoading$ | async) {
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">
                    Requesting password reset link...
                </span>
            </div>
            }
        </button>
        <button class="btn btn-danger" type="button" (click)="deleteAccount()">
            <span>Delete account</span>
            @if (deleteUserLoading$ | async) {
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">Deleting account...</span>
            </div>
            }
        </button>
    </div>
    }
</form>
