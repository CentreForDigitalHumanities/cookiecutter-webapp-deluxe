services:
  db:
    image: docker.io/postgres:16
    environment:
      - POSTGRES_DB=${SQL_DATABASE}
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - PGHOST=${SQL_HOST}
      - PGPORT=${SQL_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data/
  backend:
    build:
      context: ./backend
    volumes:
      - type: bind
        source: ./backend
        target: /backend
      - static_data:/backend/staticfiles
    environment:
      - PGDATABASE=${SQL_DATABASE}
      - PGUSER=${SQL_USER}
      - PGPASSWORD=${SQL_PASSWORD}
      - PGHOST=${SQL_HOST}
      - PGPORT=${SQL_PORT}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.dev
    command: python manage.py migrate && python manage.py collectstatic --no-input && python manage.py runserver 0.0.0.0:8000
{% if cookiecutter.saml_authentication == "Yes, please!" %}

  test-idp:
    image: ghcr.io/centrefordigitalhumanities/development-idp/development-idp:develop
    ports:
      - "7000:7000"
    command: python manage.py loaddata main/fixtures/initial.json
{% endif %}

volumes:
  db_data:
  static_data:
